name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # bun.lock é gitignored neste repo; a reprodutibilidade vem dos pins do package.json.
      - name: Install dependencies
        run: bun install

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      # A lista de gates, o env dummy e o build vivem em scripts/verify.sh.
      - name: Gates (bun verify)
        run: bun run verify
