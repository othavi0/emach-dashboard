name: Sync DB schema to ecommerce

on:
  push:
    branches: [main]
    paths:
      - "packages/db/src/schema/**"
      - "packages/db/src/queries/**"
      - "packages/db/src/utils.ts"
      - "packages/db/src/sql/triggers.sql"
      - "packages/db/src/sql/rls.sql"
      - "docs/integration/admin-ecommerce.md"
  workflow_dispatch:

jobs:
  sync:
    # O espelho de deploy recebe este arquivo e não tem o ECOMMERCE_SYNC_TOKEN.
    if: github.repository == 'othavi0/emach-dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v5
        with:
          path: dashboard

      - name: Checkout ecommerce
        uses: actions/checkout@v5
        with:
          repository: othavi0/emach-ecommerce
          token: ${{ secrets.ECOMMERCE_SYNC_TOKEN }}
          path: ecommerce

      - name: Mirror schema, queries, utils, triggers, RLS e contrato
        run: |
          set -euo pipefail
          src="dashboard/packages/db/src"
          dst="ecommerce/packages/db/src"
          mkdir -p "$dst/sql"
          rsync -a --delete "$src/schema/" "$dst/schema/"
          rsync -a --delete "$src/queries/" "$dst/queries/"
          cp "$src/utils.ts" "$dst/utils.ts"
          cp "$src/sql/triggers.sql" "$dst/sql/triggers.sql"
          cp "$src/sql/rls.sql" "$dst/sql/rls.sql"
          mkdir -p ecommerce/docs/integration
          cp dashboard/docs/integration/admin-ecommerce.md ecommerce/docs/integration/admin-ecommerce.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.ECOMMERCE_SYNC_TOKEN }}
          path: ecommerce
          branch: chore/sync-db-schema
          base: main
          commit-message: "chore: sincroniza schema e contrato com o dashboard"
          title: "chore: sincroniza schema e contrato com o dashboard"
          body: |
            PR automatico do workflow sync-db-schema (repo dashboard).

            Espelha do dashboard, que e a fonte de verdade (ADR-0009):

            - packages/db/src/schema/
            - packages/db/src/queries/
            - packages/db/src/utils.ts
            - packages/db/src/sql/triggers.sql
            - packages/db/src/sql/rls.sql
            - docs/integration/admin-ecommerce.md

            Nao editar estes arquivos diretamente neste repo - mudancas nascem no dashboard.

            Commit de origem: ${{ github.sha }}
